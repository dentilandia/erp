<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Capacitación Dentilandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F7F7;
    --surface:#FFFFFF;
    --ink:#191A46;
    --ink-soft:#5B5C82;
    --primary:#1AA79E;
    --primary-dark:#191A46;
    --primary-tint:#E3F5F3;
    --accent:#1AA79E;
    --accent-tint:#E3F5F3;
    --success:#1AA79E;
    --success-tint:#E3F5F3;
    --error:#E1574C;
    --error-tint:#FCE9E7;
    --line:#DCE2E6;
    --radius:16px;
    --shadow: 0 10px 30px -12px rgba(25,26,70,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    letter-spacing:.2px;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- Landing / name gate ---------- */
  .gate{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:
      radial-gradient(circle at 12% 18%, rgba(26,167,158,0.16), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(25,26,70,0.14), transparent 45%),
      var(--bg);
  }
  .gate-card{
    background:var(--surface);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:44px 40px;
    max-width:460px;
    width:100%;
    border:1px solid var(--line);
  }
  .gate-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent-tint);
    color:#0F6E77;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.6px;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .gate-logo{
    display:block;
    width:132px;
    height:auto;
    margin:0 auto 10px;
  }
  .brand-mark img{
    width:100%;height:100%;object-fit:cover;border-radius:11px;
  }

  .gate h1{
    font-size:30px;
    color:var(--primary-dark);
    margin:0 0 8px;
    line-height:1.15;
  }
  .gate p.sub{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.55;
    margin:0 0 26px;
  }
  .field-label{
    font-size:13px;
    font-weight:600;
    color:var(--primary-dark);
    margin-bottom:6px;
    display:block;
  }
  .gate input[type=text]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .gate input[type=text]:focus{border-color:var(--primary);}
  .gate select{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:#fff;
    margin-top:16px;
  }
  .btn{
    border:none;
    cursor:pointer;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    border-radius:12px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--primary);
    color:#fff;
    padding:14px 20px;
    font-size:15px;
    width:100%;
    margin-top:22px;
    box-shadow:0 8px 20px -8px rgba(15,110,119,0.55);
  }
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .gate-foot{
    margin-top:16px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  /* ---------- Main shell ---------- */
  .sidebar{
    width:300px;
    flex:0 0 300px;
    background:var(--primary-dark);
    color:#fff;
    padding:26px 18px 26px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex:none;
  }
  .brand-text .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#9FCFD1;font-weight:600;}
  .brand-text .v{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:700;line-height:1.15;}

  .overall{
    background:rgba(255,255,255,0.07);
    border-radius:14px;
    padding:14px 16px;
    margin:0 4px;
  }
  .overall .lbl{font-size:12px;color:#9FCFD1;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .overall .pct{font-family:'Baloo 2',sans-serif;font-size:26px;margin:4px 0 8px;}
  .track{height:8px;border-radius:99px;background:rgba(255,255,255,0.14);overflow:hidden;}
  .track > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}

  .points-box{
    background:linear-gradient(135deg, rgba(26,167,158,0.22), rgba(255,255,255,0.06));
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:12px 14px;
    margin:0 4px;
  }
  .points-box-top{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13.5px;font-weight:700;color:#fff;
  }
  .badges-row{
    margin-top:8px;
    display:flex;gap:6px;font-size:16px;
  }

  .modlist-wrap{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .modlist-hint{
    display:none;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:#9FCFD1;
    font-weight:600;
    padding:0 8px 6px;
  }
  .modlist{
    list-style:none;
    margin:0;padding:0;
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
    flex:1;
  }
  .modlist-wrap:after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:22px;
    background:linear-gradient(to bottom, rgba(10,15,45,0), var(--primary-dark));
    pointer-events:none;
  }
  .modlist li button{
    all:unset;
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:10px 10px;
    border-radius:11px;
    cursor:pointer;
    font-size:13.5px;
    color:#DCEEEE;
  }
  .modlist li button:hover{background:rgba(255,255,255,0.06);}
  .modlist li button.active{background:rgba(255,255,255,0.13);color:#fff;}
  .mod-num{
    flex:none;
    width:26px;height:26px;border-radius:8px;
    background:rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-size:12.5px;font-weight:700;
    color:#BFE3E2;
  }
  .modlist li button.done .mod-num{background:var(--success);color:#fff;}
  .mod-title{flex:1;line-height:1.25;}
  .mod-score{font-size:11px;color:#9FCFD1;font-weight:600;}

  .sidebar-foot{
    font-size:11.5px;
    color:#7FB6B8;
    padding:0 8px;
    border-top:1px solid rgba(255,255,255,0.1);
    padding-top:14px;
  }

  .main{
    flex:1;
    min-width:0;
    padding:34px 44px 60px;
    max-width:900px;
  }
  .topline{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:22px;
    gap:16px;
  }
  .greeting{color:var(--ink-soft);font-size:14px;}
  .greeting b{color:var(--primary-dark);}

  .level-tag{
    display:inline-block;
    font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;
    margin-bottom:14px;
  }
  .level-Básico{background:#E3F5F3;color:#0F6E77;}
  .level-Intermedio{background:#E7E8F5;color:#191A46;}
  .level-Técnico{background:#EDEEF0;color:#4A4B57;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 32px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:25px;
    color:var(--primary-dark);
    margin:0 0 14px;
  }
  .summary-list{
    margin:0 0 26px;
    padding:0;
    list-style:none;
    display:flex;flex-direction:column;gap:10px;
  }
  .summary-list li{
    display:flex;gap:10px;
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .summary-list li:before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    margin-top:8px;flex:none;
  }
  .quiz-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:18px;
  }
  .qcount{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .qtrack{flex:1;margin:0 16px;height:6px;background:var(--primary-tint);border-radius:99px;overflow:hidden;}
  .qtrack > i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease;}

  .question{
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 20px;
    line-height:1.4;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:14.5px;
    line-height:1.45;
    color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover{border-color:var(--primary);background:var(--primary-tint);}
  .opt .letter{
    flex:none;width:24px;height:24px;border-radius:7px;
    background:var(--bg);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--ink-soft);
  }
  .opt.correct{border-color:var(--success);background:var(--success-tint);}
  .opt.correct .letter{background:var(--success);color:#fff;border-color:var(--success);}
  .opt.incorrect{border-color:var(--error);background:var(--error-tint);}
  .opt.incorrect .letter{background:var(--error);color:#fff;border-color:var(--error);}
  .opt.disabled{cursor:default;}
  .opt.disabled:hover{background:transparent;}
  .opt.correct:hover, .opt.incorrect:hover{background:inherit;}

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    line-height:1.55;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:var(--success-tint);color:#1F5C4C;}
  .feedback.bad{background:var(--error-tint);color:#8A2E27;}
  .feedback b{display:block;margin-bottom:3px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;}

  .quiz-actions{
    display:flex;justify-content:flex-end;
    margin-top:24px;
  }
  .btn-next{
    background:var(--primary);color:#fff;
    padding:12px 22px;font-size:14.5px;
    display:none;
  }
  .btn-next.show{display:inline-block;}
  .btn-next:hover{background:var(--primary-dark);}

  .btn-start{
    background:var(--accent);color:#FFFFFF;
    padding:13px 24px;font-size:14.5px;
    box-shadow:0 8px 18px -8px rgba(26,167,158,.55);
  }
  .btn-start:hover{filter:brightness(0.96);}

  .result{
    text-align:center;
    padding:10px 0 4px;
  }
  .result .ring{
    width:120px;height:120px;margin:0 auto 18px;
    position:relative;
  }
  .result .ring svg{transform:rotate(-90deg);}
  .result .ring .pct{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-size:26px;color:var(--primary-dark);
  }
  .result h3{font-size:21px;margin:0 0 6px;color:var(--primary-dark);}
  .result p{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}
  .points-earned{
    display:inline-block;
    background:var(--accent-tint);
    color:#0F6E77;
    font-weight:700;
    font-size:13.5px;
    padding:8px 16px;
    border-radius:999px;
    margin:0 0 20px;
  }
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn-secondary{
    background:var(--surface);color:var(--primary-dark);
    border:1.5px solid var(--line);
    padding:12px 20px;font-size:14px;
  }
  .btn-secondary:hover{border-color:var(--primary);}

  /* Certificate */
  .cert{
    background:linear-gradient(155deg, var(--primary-dark), var(--primary) 65%);
    border-radius:20px;
    padding:46px 40px;
    color:#fff;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .cert:before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(245,166,35,.25), transparent 40%),
      radial-gradient(circle at 88% 85%, rgba(255,255,255,.08), transparent 45%);
  }
  .cert *{position:relative;}
  .cert .badge{
    width:64px;height:64px;border-radius:16px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:30px;
    margin:0 auto 18px;
  }
  .cert h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#BFE3E2;margin:0 0 10px;font-family:'Work Sans';font-weight:700;}
  .cert h1{font-size:30px;margin:0 0 6px;}
  .cert .name{font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--accent);margin:14px 0;}
  .cert p{color:#D9EEEE;font-size:14px;line-height:1.6;max-width:480px;margin:0 auto 22px;}
  .cert .cert-score{
    display:inline-block;background:rgba(255,255,255,.12);
    padding:8px 18px;border-radius:99px;font-weight:600;font-size:13.5px;margin-bottom:22px;
  }

  .empty-hint{
    color:var(--ink-soft);
    font-size:14px;
    text-align:center;
    padding:60px 20px;
  }

  .podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    padding:10px 0;
  }
  .podium-item{
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    text-align:center;
    width:150px;
  }
  .podium-item.rank-1{
    background:linear-gradient(160deg, #FFF6E3, #FFFFFF);
    border-color:#F0D28A;
    transform:translateY(-10px);
    box-shadow:var(--shadow);
  }
  .medal{font-size:34px;margin-bottom:4px;}
  .pname{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--primary-dark);}
  .psub{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .ppts{font-size:13px;font-weight:700;color:#0F6E77;}

  .my-position{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .my-position.in-top{border-color:#1AA79E;}
  .mp-rank{
    font-family:'Baloo 2',sans-serif;
    font-size:28px;font-weight:700;
    color:var(--primary-dark);
    flex:none;
    width:64px;height:64px;
    border-radius:50%;
    background:var(--primary-tint);
    display:flex;align-items:center;justify-content:center;
  }
  .mp-name{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px;}
  .mp-pts{font-size:13.5px;color:#0F6E77;font-weight:700;margin-bottom:6px;}

  /* ---- Home / track selector ---- */
  .home-wrap{max-width:1000px;}
  .home-head{margin-bottom:22px;}
  .home-head h1{font-size:26px;color:var(--primary-dark);margin:0 0 6px;}
  .home-head p{color:var(--ink-soft);font-size:14px;margin:0;}
  .track-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
    margin-bottom:18px;
  }
  .track-card{
    all:unset;
    cursor:pointer;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .track-card:hover{border-color:var(--primary);transform:translateY(-2px);}
  .track-card.featured{border-color:var(--accent);background:linear-gradient(160deg, var(--accent-tint), #fff);}
  .track-card .t-icon{font-size:26px;}
  .track-card .t-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16.5px;color:var(--primary-dark);}
  .track-card .t-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
  .track-card .t-pct{font-size:12px;font-weight:700;color:#0F6E77;}
  .track-card .t-soon{
    position:absolute;top:16px;right:16px;
    background:#EDEEF0;color:#6B6C78;
    font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;
  }
  .track-card .t-role-badge{
    position:absolute;top:16px;right:16px;
    background:var(--accent);color:#fff;
    font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:999px;
  }
  .home-topbar{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
  }
  .home-topbar-actions{display:flex;gap:10px;}
  .home-topbar-actions button{
    all:unset;cursor:pointer;font-size:12.5px;font-weight:700;
    padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--primary-dark);
  }
  .home-topbar-actions button:hover{border-color:var(--primary);}

  /* ---- Coming soon ---- */
  .soon-card{
    background:var(--bg);
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:50px 30px;
    text-align:center;
  }
  .soon-card .s-icon{font-size:42px;margin-bottom:14px;}
  .soon-card h2{font-size:20px;color:var(--primary-dark);margin:0 0 10px;}
  .soon-card p{color:var(--ink-soft);font-size:13.5px;max-width:440px;margin:0 auto;line-height:1.5;}

  /* ---- Así actuamos ---- */
  .principle-card{
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:14px;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .principle-card.read{border-color:#1AA79E;background:var(--accent-tint);}
  .principle-num{
    flex:none;width:36px;height:36px;border-radius:50%;
    background:var(--primary-tint);color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
  }
  .principle-card.read .principle-num{background:#1AA79E;color:#fff;}
  .principle-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--primary-dark);margin-bottom:6px;}
  .principle-text{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:10px;}
  .principle-mark{
    all:unset;cursor:pointer;font-size:12px;font-weight:700;
    padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft);
  }
  .principle-card.read .principle-mark{border-color:#1AA79E;color:#0F6E77;background:#fff;}

  /* ---- Documentos ---- */
  .doc-card{
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:14px;
  }
  .doc-card.signed{border-color:#1AA79E;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .doc-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--primary-dark);}
  .doc-badge-signed{background:#E3F5F3;color:#0F6E77;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .doc-body{
    background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;
    max-height:160px;overflow-y:auto;margin-bottom:14px;
  }
  .doc-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .doc-form .field{flex:1;min-width:160px;}
  .doc-form label{font-size:11.5px;font-weight:600;color:var(--primary-dark);display:block;margin-bottom:4px;}
  .doc-form input[type=text]{
    width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-family:'Work Sans',sans-serif;
  }
  .doc-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);width:100%;margin-bottom:4px;}

  /* ---- Firma electrónica (dibujar o subir foto) ---- */
  .sig-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .sig-tab{
    all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;
    border:1.5px solid var(--line);color:var(--ink-soft);
  }
  .sig-tab.active{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-tint);}
  .sig-canvas-wrap{
    border:1.5px dashed var(--line);border-radius:10px;background:#fff;
    position:relative;margin-bottom:8px;
  }
  .sig-canvas{display:block;width:100%;height:140px;touch-action:none;cursor:crosshair;border-radius:10px;}
  .sig-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--line);font-size:12.5px;pointer-events:none;
  }
  .sig-clear-btn{
    all:unset;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-soft);
    text-decoration:underline;margin-bottom:10px;display:inline-block;
  }
  .sig-photo-preview{max-width:220px;max-height:120px;border-radius:8px;border:1.5px solid var(--line);display:block;margin-bottom:10px;}
  .sig-legal-note{font-size:11px;color:var(--ink-soft);margin:0 0 12px;line-height:1.4;}

  /* ---- Modal (reemplaza prompt()/alert() nativos, que suelen bloquearse en la vista previa) ---- */
  .modal-overlay{
    position:fixed;inset:0;z-index:9999;
    background:rgba(15,20,40,0.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:18px;
    padding:28px 26px;max-width:360px;width:100%;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.35);
  }
  .modal-box h3{margin:0 0 6px;font-size:17px;color:var(--primary-dark);font-family:'Baloo 2',sans-serif;}
  .modal-box p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}
  .modal-box input[type=password], .modal-box input[type=text]{
    width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);
    font-size:14px;font-family:'Work Sans',sans-serif;margin-bottom:8px;
  }
  .modal-error{display:none;color:var(--error);font-size:12.5px;margin:0 0 10px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
    .app{flex-direction:column;}
    .sidebar{width:100%;flex:none;}
    .modlist{max-height:340px;}
    .modlist-hint{display:flex !important;}
    .main{padding:26px 18px 50px;max-width:none;}
  }
</style>

  summary:[
    "Todo paciente que ingresa a las instalaciones a su cita debe quedar en estado \"Espera\" en el sistema.",

    "Se realiza \"evolución de seguro\" cuando un paciente no asiste frecuentemente y tiene procedimientos pendientes (operatoria, finalización de endodoncia, aparatología), o cuando quiere retirar el aparato sin continuar el tratamiento — es responsabilidad compartida de todo el equipo.",

  questions:[

  summary:[

    "Citas de 20 minutos: controles de aparatología, impresión de aparato, revisión de RX, controles periódicos (1/3/4/6 meses) y exodoncia.",
    "Se pueden atender entre paciente y paciente: desalojo de coltosol, retiro de aparato, urgencias de aparato y molestias en diente.",

    {q:"¿Cuál de estos pacientes SÍ se puede atender entre paciente y paciente?", opts:["Paciente de difícil manejo","Paciente con síndrome cognitivo","Desalojo de coltosol","Instalación de aparato fijo"], correct:2, explain:"El desalojo de coltosol es una urgencia que se puede atender entre paciente y paciente; los otros casos requieren cita completa."},

    {q:"¿En qué horario se agendan las citas tentativas?", opts:["8:00 a 8:30 am","12:00 a 12:30 pm","1:00 a 1:30 pm","5:30 a 6:00 pm"], correct:1, explain:"Las citas tentativas solo se agendan en el espacio de 12:00 a 12:30 pm del sistema."},

    {q:"¿Cuánto dura una cita de control de aparatología?", opts:["10 minutos","20 minutos","30 minutos","40 minutos"], correct:1, explain:"Los controles de aparatología, impresión de aparato y revisión de RX son citas de 20 minutos."}

    "El proceso sigue este orden: 1) WhatsApp desde la vista de día de la agenda (entre 9 y 11 am), 2) llamada en la tarde del mismo día, 3) retomar el chat en B2chat con la plantilla (tarde del día 1), 4) llamada en la mañana del día 2, 5) retomar el chat en B2chat (mañana del día 2), 6) enviar plantilla de cancelación y notificar al equipo la disponibilidad, máximo a medio día del día hábil anterior.",
    "A pacientes de primera vez se envía al confirmar: instrucciones, PDF de autorización de datos y consentimiento, imagen de instrucciones, imagen de métodos de pago y la ubicación de la sede.",
    "A pacientes de control de 6 meses se les envía un recordatorio de confirmación una semana antes de la cita."

  questions:[
    {q:"¿Con cuántos días hábiles de anterioridad se confirma una cita?", opts:["Un día hábil","Dos días hábiles","Tres días hábiles","Una semana"], correct:1, explain:"La confirmación se realiza con dos días hábiles de anterioridad a la cita."},
    {q:"¿En qué horario se debe enviar el primer mensaje de confirmación por WhatsApp?", opts:["Entre 6 y 8 am","Entre 9 y 11 am","Entre 2 y 4 pm","Después de las 6 pm"], correct:1, explain:"El primer mensaje de WhatsApp se envía desde la vista de día de la agenda, entre 9 y 11 am."},
    {q:"Si el paciente no ha respondido tras todos los intentos, ¿qué se hace como último paso?", opts:["Se cancela la cita sin avisar al equipo","Se envía la plantilla de cancelación y se notifica al equipo la disponibilidad, máximo a medio día del día hábil anterior","Se reagenda automáticamente para el mes siguiente","No se hace nada adicional"], correct:1, explain:"El último paso es enviar la plantilla de cancelación y notificar al equipo la disponibilidad del espacio, máximo a medio día del día hábil anterior."},
    {q:"¿Con cuánta anticipación se envía el recordatorio a pacientes de control de 6 meses?", opts:["El mismo día de la cita","Un día antes","Una semana antes","Un mes antes"], correct:2, explain:"A los pacientes de control de 6 meses se les envía el mensaje de confirmación de B2chat una semana antes de la cita."}
  ]

    "Siempre se debe ofrecer a los pacientes tomar la radiografía con el equipo que tenemos en sede; en ese caso, deben llegar 20 minutos antes de su cita para contar con tiempo suficiente.",
    "La radiografía debe quedar adjunta a la historia clínica del paciente ANTES de la hora de la cita.",
    "Todas las radiografías deben quedar adjuntas en la historia clínica de Oral Drive, en la sección \"RX/Imágenes/Docs\"; si es periapical, el nombre del archivo debe indicar el número del diente.",
    "Si el paciente extravía la orden de radiografías, se debe enviar una nueva orden."

  questions:[

    {q:"¿Cuál de estas situaciones justifica citar con radiografía panorámica?", opts:["Dolor por caries","Absceso dental","No ha salido el diente permanente hace mucho tiempo","Cambios de color en el diente"], correct:2, explain:"La panorámica aplica, entre otros casos, cuando el diente permanente aún no sale y el de leche se cayó hace tiempo. Dolor por caries, absceso y cambios de color son motivos de radiografía periapical."},

    {q:"¿Qué ocurre si un paciente no tiene la radiografía requerida?", opts:["Se cancela la cita siempre, sin excepción","En general no impide la cita, pero sí puede impedir iniciar tratamiento en la valoración — salvo que la radiografía sea indispensable para esa cita puntual, en cuyo caso se cancela","Se le cobra una multa","Se reprograma automáticamente en un mes"], correct:1, explain:"Como regla general no impide la cita, pero si durante la confirmación se identifica que la radiografía es indispensable para esa cita en particular, la cita se debe cancelar."},
    {q:"Si el paciente va a tomarse la radiografía con el equipo de la sede, ¿con cuánto tiempo de anticipación debe llegar?", opts:["No necesita llegar antes","10 minutos antes","20 minutos antes","1 hora antes"], correct:2, explain:"Debe llegar 20 minutos antes de su cita, para contar con tiempo suficiente para tomar la radiografía antes de la atención."},
    {q:"¿Hasta cuándo debe estar adjunta la radiografía a la historia clínica del paciente?", opts:["Puede adjuntarse después de la cita","Debe estar adjunta antes de la hora de la cita","Solo se adjunta si el paciente la pide","No es necesario adjuntarla si el paciente la trae físicamente"], correct:1, explain:"La radiografía debe quedar adjunta a la historia clínica del paciente antes de la hora de la cita."},
    {q:"¿Dónde deben quedar adjuntas todas las radiografías del paciente?", opts:["En un correo aparte","En Oral Drive, en la sección \"RX/Imágenes/Docs\"","En una carpeta física únicamente","No es necesario adjuntarlas"], correct:1, explain:"Todas las radiografías deben quedar adjuntas en la historia clínica de Oral Drive, en \"RX/Imágenes/Docs\"."}

{
  id:"aparatologia",
  title:"Tratamientos de aparatología",
  level:"Técnico",
  icon:"🦷",
  summary:[
    "Todo paciente debe salir de la cita de impresión con la cita de instalación ya programada; la observación de la cita queda como \"Instalación aparato (Validar si llegó aparato)\", y al llegar el aparato se cambia a \"Ya llegó aparato\".",
    "Los presupuestos de aparatología pueden ser a 12, 14 o 16 meses según el criterio clínico; el paciente paga mínimo 12 y máximo 16 controles.",
    "Todos los presupuestos de aparatología deben incluir la observación de que el tratamiento NO incluye: reparaciones por mal uso, modificaciones durante la evolución, re-cementaciones no programadas, retiros no programados (tienen costo adicional), ni otros tratamientos de odontología general (caries, endodoncia, extracciones, profilaxis y flúor).",
    "El documento \"Acuerdo Tratamientos de Aparatología\" debe quedar firmado al finalizar la cita de impresión; lo diligencia Recepción, máximo con dos días hábiles de antelación, e idealmente lo firma la persona que coordina la cita y los pagos.",
    "La revisión de RX, la impresión y la instalación del aparato debe realizarlas la misma odontopediatra, salvo excepciones lógicas (pacientes de fuera de la ciudad, entre otras).",
    "Particularidades de presupuesto: máscara facial con Hyrax siempre incluye la placa de Hawley inferior (tratamiento pasivo, por si se requiere retener); Flipper solo incluye 1 diente (adicionales se cobran aparte, se pagan entre impresión e instalación); tracción cervical y mentonera requieren que el paciente pague la mitad del valor total presupuestado para poder solicitarlas al proveedor.",
    "Pacientes que no asistirán a controles por vivir en otra ciudad: se cobra impresión + instalación + 6 cuotas mensuales de una vez.",
    "Si el paciente abandona el tratamiento sin aviso: si faltan más de 3 cuotas, se cobra la mitad de los controles restantes y se cierra el presupuesto; si faltan menos de 3 cuotas, debe pagar la totalidad del saldo.",
    "Al retirar el aparato: si faltan menos de 3 controles, se paga el saldo restante completo; si faltan más de 3 controles, se paga la mitad de los controles y se cierra el presupuesto (se eliminan los ítems que ya no se van a realizar).",
    "Si el paciente retoma el tratamiento después de varios meses sin asistir, NO debe pagar esos meses — solo si la odontopediatra decide cobrar un control de advertencia, dejando constancia en la historia clínica y en la observación de la cita.",
    "Si el paciente llega con un aparato de otro consultorio y quiere continuar en Dentilandia: si el aparato sirve y está en buen estado, se montan las cuotas que falten más 2 de margen (presupuesto \"Nombre del aparato + Externo\"); si no sirve, se monta un tratamiento nuevo; si hay que enviarlo al laboratorio, se cobra laboratorio x3 por la toma de impresión.",
    "Reparación de aparato: abono mínimo $90.000 (se carga como saldo a favor); laboratorio x2.5 si no se toma impresión, x3 si se toma impresión. Solo se notifica el valor final al paciente cuando supere los $90.000 del abono inicial; si es muy costosa, se reporta a administración.",
    "Reposición de aparato (el paciente lo perdió): laboratorio x2.5 sin impresión o x3 con impresión; abono mínimo del 50% del valor total (saldo a favor); se cobra con el ítem \"Reposición de Aparato\", sin cargar impresión e instalación por separado.",
    "Readaptación de aparatos (el paciente no asistió y el aparato ya no adapta): abono mínimo de $90.000, a cargo del paciente.",
    "Modificación de aparatos (agregar o quitar aditamentos): abono mínimo $90.000; costo aproximado de laboratorio x3; la odontopediatra debe explicar en consultorio por qué se requiere y que tiene costo adicional; no se cobran modificaciones que ya estaban incluidas en el plan original.",
    "Si el paciente no quiere continuar con el aparato: retiro dentro de los 20 días siguientes a la instalación no tiene costo; después de 20 días se cobra una cuota mensual del tratamiento, y se cierra el presupuesto.",
    "Cambio de aparato durante el tratamiento (cambio de odontopediatra, cambios morfológicos, o el paciente quiere cambiar de fijo a removible o viceversa): se cobra laboratorio x3 o la impresión/instalación del nuevo aparato (lo que sea más económico), se eliminan las cuotas del aparato anterior y se cargan las del nuevo.",
    "UX de aparato (bandas sueltas, molestia, dolor, no gira el tornillo): si se envía a reparación, la cita de retiro no tiene costo (salvo que lleve más de 1 mes desde el último control); si es una urgencia, se puede atender entre paciente y paciente con cualquier especialista — el péndulo y los pacientes de difícil manejo requieren cita de 20 minutos, y una descementación requiere mínimo 10 minutos.",
    "El archivo de facturas de laboratorio instaladas se entrega a administración el día 25 de cada mes (o el día hábil anterior si el 25 no es hábil); las facturas de aparatos pendientes por instalar e instalados del mes se entregan el día 26.",
    "Los aparatos deben llegar del laboratorio con factura electrónica (QR y CUFE); los entregados del 26 al 30 pueden llegar sin ella, pero la factura física debe llegar máximo el 6to día calendario del mes siguiente.",
    "El cuadro de control de aparatología debe estar siempre actualizado; una vez instalado el aparato y registrado en el cuadro de liquidación, no se elimina del cuadro — se oculta usando el filtro de la columna \"fecha de instalación\"."
  ],
  questions:[
    {q:"¿Con qué debe salir programado el paciente al terminar su cita de impresión de aparato?", opts:["Con la cita de instalación ya programada","Sin ninguna cita programada","Con la cita de retiro del aparato","Con la factura ya generada"], correct:0, explain:"Todos los pacientes deben salir de la cita de impresión con la cita de instalación ya programada."},
    {q:"¿Cuál es el número mínimo y máximo de controles que paga el paciente en un tratamiento de aparatología?", opts:["Mínimo 6, máximo 10","Mínimo 12, máximo 16","Mínimo 10, máximo 12","Mínimo 8, máximo 14"], correct:1, explain:"El paciente paga mínimo 12 controles y máximo 16, según el plazo de 12, 14 o 16 meses definido clínicamente."},
    {q:"¿Quién diligencia el documento \"Acuerdo Tratamientos de Aparatología\", y con qué anticipación?", opts:["La odontopediatra, el mismo día","Recepción, máximo con dos días hábiles de antelación","El paciente por sí solo","El auxiliar de odontología, una semana antes"], correct:1, explain:"La encargada de diligenciar el documento es Recepción, máximo con dos días hábiles de antelación; idealmente lo firma quien coordina la cita y los pagos."},
    {q:"Para una máscara facial con Hyrax, ¿qué se debe presupuestar siempre además del aparato?", opts:["Nada más, solo la máscara","La placa de Hawley inferior (tratamiento pasivo), por si se requiere para retener","Un segundo Hyrax de repuesto","Solo se presupuesta si el paciente lo pide"], correct:1, explain:"Siempre se debe presupuestar la impresión e instalación de la placa de Hawley inferior, pues puede requerirse para retener el maxilar y evitar movimientos no deseados."},
    {q:"En el sistema Flipper, ¿cuántos dientes incluye el presupuesto base?", opts:["1 diente","2 dientes","3 dientes","Todos los que necesite el paciente"], correct:0, explain:"El presupuesto del sistema Flipper solo incluye 1 diente; los adicionales se cobran aparte con el ítem \"Diente Adicional\"."},
    {q:"¿Cuál es el valor mínimo a cobrar (abono) por una reparación de aparato?", opts:["$50.000","$75.000","$90.000","$120.000"], correct:2, explain:"El valor mínimo a cobrar (abono) por concepto de reparación de aparato es $90.000, y se carga como saldo a favor."},
    {q:"¿Cuál es el abono mínimo para una readaptación de aparato?", opts:["$50.000","$75.000","$90.000","No tiene abono mínimo"], correct:2, explain:"El abono mínimo para enviar el aparato a readaptación al laboratorio es de $90.000, a cargo del paciente."},
    {q:"En una reposición de aparato (el paciente lo perdió) donde SÍ se toma nueva impresión, ¿qué multiplicador de laboratorio aplica?", opts:["x1","x2","x2.5","x3"], correct:3, explain:"En reposición de aparato se cobra laboratorio x2.5 si no se toma impresión, y x3 si sí se toma impresión."},
    {q:"Si el paciente solicita retirar el aparato después de 20 días de la instalación, ¿qué se cobra?", opts:["Nada, siempre es gratis","Una cuota mensual del tratamiento","El valor total del tratamiento","El doble de una cuota mensual"], correct:1, explain:"Si el retiro se da después de 20 días de la instalación, se cobra una cuota mensual del tratamiento y se cierra el presupuesto."},
    {q:"Si un paciente abandona el tratamiento sin aviso y le faltan más de 3 cuotas mensuales, ¿qué se cobra?", opts:["Nada, se cierra el presupuesto sin cobrar","La mitad de los controles restantes, y se cierra el presupuesto","El total de las cuotas restantes","Solo la primera cuota pendiente"], correct:1, explain:"Si faltan más de 3 cuotas, se cobra la mitad de los controles restantes y se cierra el presupuesto; si faltan menos de 3, debe pagar la totalidad del saldo."},
    {q:"Si un paciente retoma el tratamiento después de varios meses sin asistir a controles, ¿debe pagar esos meses?", opts:["Sí, siempre debe pagar todos los meses atrasados","No, salvo que la odontopediatra decida cobrar un control de advertencia, dejando constancia en la historia clínica","Solo si el aparato es fijo","Sí, el doble de las cuotas atrasadas"], correct:1, explain:"No debe pagar los meses que estuvo sin asistir; solo si la odontopediatra decide cobrar un control de advertencia, dejando constancia en la HC y en la observación de la cita."},

/* ============ VIDEOTECA (Herramientas y Sistemas) ============
   videoUrl: null mientras no exista el video real — se muestra como
   "Próximamente". Cuando Tomás suba el video a YouTube (no listado),
   basta con pegar la URL normal (youtu.be/... o youtube.com/watch?v=...)
   y toYouTubeEmbed() la convierte automáticamente. */
const VIDEO_CATEGORIES = [
  {id:'general', label:'General (Oral Drive)'},
  {id:'recepcion', label:'Recepción'},
  {id:'servicio_cliente', label:'Servicio al Cliente'},
];
let VIDEOTECA = []; // se carga desde Supabase (capacitacion_videos) — ver loadVideoteca()
async function loadVideoteca(){
  try{
    const { data, error } = await sb.from('capacitacion_videos').select('*').order('categoria').order('orden');
    if(error) throw error;
    VIDEOTECA = (data||[]).map(v=>({ id:v.id, categoria:v.categoria, tarea:v.tarea, title:v.titulo, videoUrl:v.video_url }));
  }catch(e){ console.error('No se pudo cargar el catálogo de la videoteca', e); VIDEOTECA = []; }
}
function toYouTubeEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function youTubeVideoId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}

const PASS_SCORE = 80; // porcentaje mínimo para considerar un módulo "aprobado"
const EXCELLENCE_SCORE = 90; // porcentaje a partir del cual se gana el bono de puntos adicional

/* ============ PUNTOS E INSIGNIAS ============
   pts por respuesta correcta (última corrida) + bono por aprobar + bono por
   aprobar al primer intento. Se calcula sobre cualquier objeto "modules"
   (funciona tanto para el usuario actual como para cualquier empleado cargado
   desde el almacenamiento compartido). */
/* ============ REGISTRO DE TRACKS (para puntos, insignias y progreso) ============
   "prefix: null" mantiene las claves de Políticas sin prefijo (compatibilidad con
   lo ya publicado). Los tracks nuevos usan clave compuesta "prefix::moduleId"
   para no chocar entre sí. */
const TRACK_REGISTRY = [
  {prefix:null, modules:MODULES},
  {prefix:'mf-recepcion', modules:MF_RECEPCION},
  {prefix:'mf-servicio', modules:MF_SERVICIO},
  {prefix:'mf-auxiliar', modules:MF_AUXILIAR},
  {prefix:'sst', modules:SST_MODULES},
];
function progKey(prefix, moduleId){ return prefix ? `${prefix}::${moduleId}` : moduleId; }

const MF_TRACKS = {
  'recepcion': {prefix:'mf-recepcion', title:'Manual de Funciones — Recepción', modules: MF_RECEPCION},
  'servicio-cliente': {prefix:'mf-servicio', title:'Manual de Funciones — Servicio al Cliente', modules: MF_SERVICIO},
  'auxiliar': {prefix:'mf-auxiliar', title:'Manual de Funciones — Auxiliar de Odontología', modules: MF_AUXILIAR},
};
const SST_TRACK = {prefix:'sst', title:'Seguridad y Salud en el Trabajo', modules: SST_MODULES};

function computePoints(modules){
  let pts = 0;
  TRACK_REGISTRY.forEach(({prefix, modules:mods})=>{
    mods.forEach(m=>{
      const p = modules[progKey(prefix, m.id)];
      if(p && p.status==='completed'){
        pts += (p.correct||0) * 10;
        if((p.bestScore ?? p.score) >= PASS_SCORE) pts += 50;
        if((p.bestScore ?? p.score) >= EXCELLENCE_SCORE) pts += 25;
        if(p.firstTryPassed) pts += 25;
      }
    });
  });
  const asi = modules['_asi_actuamos'];
  if(asi && asi.readIds){
    pts += asi.readIds.length * 5;
    if(asi.readIds.length >= ASI_ACTUAMOS.length) pts += 50;
  }
  const vids = modules['_videoteca'];
  if(vids && vids.watchedIds){
    pts += vids.watchedIds.length * 10;
  }
  return pts;
}

function computeBadges(modules){
  const badges = [];
  let allCompleted = [];
  let totalModuleCount = 0;
  let maxStreak = 0, cur = 0;
  TRACK_REGISTRY.forEach(({prefix, modules:mods})=>{
    totalModuleCount += mods.length;
    mods.forEach(m=>{
      const p = modules[progKey(prefix, m.id)];
      if(p && p.status==='completed'){
        allCompleted.push(p);
        if(p.firstTryPassed){ cur++; maxStreak=Math.max(maxStreak,cur); } else { cur=0; }
      } else {
        cur = 0;
      }
    });
  });
  if(allCompleted.length>=1) badges.push({icon:'🌱', label:'Primer módulo completado'});
  if(allCompleted.some(p=>(p.bestScore ?? p.score)===100)) badges.push({icon:'🥇', label:'Módulo perfecto (100%)'});
  const passedCount = allCompleted.filter(p=>(p.bestScore ?? p.score)>=PASS_SCORE).length;
  if(passedCount>=6) badges.push({icon:'🚀', label:'Mitad del camino'});
  if(passedCount>=totalModuleCount) badges.push({icon:'🎓', label:'Graduada Dentilandia'});
  if(maxStreak>=3) badges.push({icon:'🔥', label:'Racha de 3 al primer intento'});
  const mfRolesCompleted = Object.values(MF_TRACKS).filter(trackDef =>
    trackDef.modules.every(m=>{
      const p = modules[progKey(trackDef.prefix, m.id)];
      return p && p.status==='completed' && (p.bestScore ?? p.score) >= PASS_SCORE;
    })
  ).length;
  if(mfRolesCompleted >= 2) badges.push({icon:'🔀', label:'Personal polivalente — sabe más de un rol'});
  const asi = modules['_asi_actuamos'];
  if(asi && asi.readIds && asi.readIds.length >= ASI_ACTUAMOS.length) badges.push({icon:'💚', label:'Vive los principios de Dentilandia'});
  const vids = modules['_videoteca'];
  const totalRealVideos = VIDEOTECA.filter(v=>v.videoUrl).length;
  if(vids && vids.watchedIds && totalRealVideos>0 && vids.watchedIds.length >= totalRealVideos) badges.push({icon:'🎬', label:'Videoteca al día'});
  return badges;
}

   Cada persona inicia sesión con su cuenta real (Supabase Auth, la misma
   del ERP). Los datos quedan protegidos por RLS: cada quien lee/escribe
   solo lo suyo; fn_es_admin() (perfiles.rol = 'admin') puede leer todo. */

/* Trae el perfil (nombre/cargo/sede/rol) y reconstruye state.progress
   a partir de las tablas normalizadas — mismo "shape" que usaba el resto
   de la app antes, para no tener que tocar el resto del código. */
async function loadProgress(perfilId){
  const progress = {};
  try{
    const { data: mods } = await sb.from('capacitacion_progreso').select('*').eq('perfil_id', perfilId);
    (mods||[]).forEach(m=>{
      progress[m.modulo_key] = {
        status: m.status, score: m.score, bestScore: m.best_score,
        correct: m.correct, total: m.total, answered: m.total,
        attempts: m.attempts, firstTryPassed: m.first_try_passed
      };
    });
  }catch(e){ console.error('No se pudo cargar el progreso de módulos', e); }

  try{
    const { data: asi } = await sb.from('capacitacion_asi_actuamos').select('principio_id').eq('perfil_id', perfilId);
    if(asi && asi.length) progress['_asi_actuamos'] = { readIds: asi.map(a=>a.principio_id) };
  }catch(e){ console.error('No se pudo cargar Así actuamos', e); }

  try{
    const { data: vids } = await sb.from('capacitacion_video_visto').select('video_id').eq('perfil_id', perfilId);
    if(vids && vids.length) progress['_videoteca'] = { watchedIds: vids.map(v=>v.video_id) };
  }catch(e){ console.error('No se pudo cargar videos vistos', e); }

  try{
    const { data: docs } = await sb.from('capacitacion_documentos_firmados').select('*').eq('perfil_id', perfilId);
    if(docs && docs.length){
      const acuses = {};
      docs.forEach(d=>{ acuses[d.doc_id] = { name:d.nombre_firma, cedula:d.cedula, signedAt:d.signed_at, signatureDataUrl:d.firma_data }; });
      progress['_acuses'] = acuses;
    }
  }catch(e){ console.error('No se pudieron cargar los documentos firmados', e); }

  return progress;
}

/* Guarda TODO lo que hay en state.progress ahora mismo (upsert idempotente).
   Se usa después de cualquier acción (responder pregunta, marcar video,
   firmar documento) — como cada fila tiene su propia llave primaria, repetir
   el guardado de lo que no cambió no hace daño. */
async function saveProgress(){
  if(!state.perfilId) return false;
  const delays = [500, 1200, 2500];
  for(let attempt=0; attempt<=delays.length; attempt++){
    try{
      await saveProgressOnce();
      hideSaveWarning();
      return true;
    }catch(e){
      if(attempt < delays.length){
        console.error(`No se pudo guardar el progreso (intento ${attempt+1}), reintentando…`, e);
        await new Promise(r => setTimeout(r, delays[attempt]));
      } else {
        console.error('No se pudo guardar el progreso después de varios intentos', e);
        showSaveWarning();
        return false;
      }
    }
  }
}

async function saveProgressOnce(){
  const perfilId = state.perfilId;

  // Módulos de cuestionarios
  const moduleRows = Object.entries(state.progress)
    .filter(([key]) => !key.startsWith('_'))
    .map(([key, p]) => ({
      perfil_id: perfilId, modulo_key: key, status: p.status,
      score: p.score ?? null, best_score: p.bestScore ?? p.score ?? null,
      correct: p.correct ?? null, total: p.total ?? null,
      attempts: p.attempts ?? 0, first_try_passed: !!p.firstTryPassed,
      updated_at: new Date().toISOString()
    }));
  if(moduleRows.length){
    const { error } = await sb.from('capacitacion_progreso').upsert(moduleRows, { onConflict: 'perfil_id,modulo_key' });
    if(error) throw error;
  }

  // Así actuamos
  const asi = state.progress['_asi_actuamos'];
  if(asi && asi.readIds && asi.readIds.length){
    const rows = asi.readIds.map(id => ({ perfil_id: perfilId, principio_id: id }));
    const { error } = await sb.from('capacitacion_asi_actuamos').upsert(rows, { onConflict: 'perfil_id,principio_id' });
    if(error) throw error;
  }

  // Videos vistos
  const vids = state.progress['_videoteca'];
  if(vids && vids.watchedIds && vids.watchedIds.length){
    const rows = vids.watchedIds.map(id => ({ perfil_id: perfilId, video_id: id }));
    const { error } = await sb.from('capacitacion_video_visto').upsert(rows, { onConflict: 'perfil_id,video_id' });
    if(error) throw error;
  }

  // Documentos firmados (solo se insertan los que todavía no existan)
  const acuses = state.progress['_acuses'];
  if(acuses){
    for(const [docId, ack] of Object.entries(acuses)){
      if(ack.pendingSync){
        const { error } = await sb.from('capacitacion_documentos_firmados').insert({
          perfil_id: perfilId, doc_id: docId, nombre_firma: ack.name,
          cedula: ack.cedula, firma_data: ack.signatureDataUrl
        });
        if(error) throw error;
        delete ack.pendingSync;
      }
    }
  }
}

async function loadAllEmployees(){
  // Con Postgres real esto es una consulta directa — ya no depende de
  // ningún índice paralelo ni de storage.list(). fn_es_admin() (RLS) es
  // quien decide si el usuario actual puede ver todos los perfiles.
  const out = [];
  try{
    const { data: perfiles, error } = await sb.from('perfiles').select('id,nombre,cargo,sede_id,rol');
    if(error) throw error;
    for(const p of (perfiles||[])){
      const modules = await loadProgress(p.id);
      let updatedAt = null;
      Object.values(modules).forEach(m=>{ if(m && m.status==='completed'){ /* usamos ahora como aproximación si no hay fecha por módulo */ } });
      const { data: lastRow } = await sb.from('capacitacion_progreso').select('updated_at').eq('perfil_id', p.id).order('updated_at', { ascending:false }).limit(1);
      if(lastRow && lastRow.length) updatedAt = lastRow[0].updated_at;
      out.push({
        id: p.id, name: p.nombre, rol: p.cargo, sede: sedeNombre(p.sede_id),
        modules, updatedAt
      });
    }
  }catch(e){ console.error('No se pudo cargar la lista de empleados', e); }
  return out;
}

/* Se ejecuta apenas hay una sesión válida (login o registro) — trae el
   perfil (o pide completarlo si falta) y entra a la pantalla de inicio. */
async function onAuthenticated(user){
  root.innerHTML = `<div class="gate"><div class="gate-card"><p class="sub">Cargando tu cuenta…</p></div></div>`;
  const { data: perfil, error } = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  if(error || !perfil){
    // Cuenta del ERP sin perfil todavía — se le pide completar los datos.
    renderCompleteProfile(user);
    return;
  }
  const isAdmin = perfil.rol === 'admin';
  if(!perfil.cargo && !isAdmin){
    // Falta el cargo (Recepción/Servicio al Cliente/Auxiliar) — necesario
    // para el resto de la app; a un admin no se le exige.
    renderCompleteProfile(user, perfil);
    return;
  }
  state.perfilId = perfil.id;
  state.name = perfil.nombre;
  state.isAdmin = isAdmin;
  state.rol = perfil.cargo || ''; // "rol" en el resto de la app = cargo de capacitación (Recepción/SAC/Auxiliar)
  state.sedeId = perfil.sede_id || '';
  state.sede = sedeNombre(perfil.sede_id);
  state.progress = await loadProgress(perfil.id);
  await loadVideoteca();
  state.currentModuleId = MODULES[0].id;
  renderHome();
}

        <label class="field-label" style="margin-top:16px;">Sede donde trabajas</label>
        <select id="cpSede">
          <option value="">Selecciona tu sede</option>
          ${SEDES.map(s=>`<option value="${s.id}" ${existingPerfil && existingPerfil.sede_id===s.id ? 'selected':''}>${s.nombre}</option>`).join('')}
        </select>
        <label class="field-label" style="margin-top:16px;">Tu rol principal</label>
        <select id="cpRol">
          <option value="">Selecciona tu rol</option>
          ${ROLES.map(r=>`<option value="${r.id}">${r.label}</option>`).join('')}
        </select>
        <button class="btn btn-primary" id="cpBtn">Guardar y continuar</button>
      </div>
    </div>
  `;
  document.getElementById('cpBtn').addEventListener('click', async ()=>{
    const nombre = document.getElementById('cpNombre').value.trim();
    const sedeId = document.getElementById('cpSede').value;
    const rolCargo = document.getElementById('cpRol').value;
    if(!nombre || !sedeId || !rolCargo) return;
    const { error } = existingPerfil

  });

function renderDocsList(docs, acks){

    return `

          <div class="doc-title">${d.title}</div>
          ${ack ? `<span class="doc-badge-signed">✓ Firmado el ${new Date(ack.signedAt).toLocaleDateString('es-CO',{dateStyle:'medium'})}</span>` : ''}
        </div>
        <div class="doc-body">${d.body}</div>
        ${ack ? `
          <p style="font-size:12px;color:var(--ink-soft);margin:0 0 8px;">Recibido por <b>${ack.name}</b> (C.C. ${ack.cedula}) el ${new Date(ack.signedAt).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}.</p>
          ${ack.signatureDataUrl ? `<img src="${ack.signatureDataUrl}" alt="Firma de ${ack.name}" style="max-width:220px;max-height:110px;border:1.5px solid var(--line);border-radius:8px;background:#fff;display:block;">` : ''}
        ` : `
          <div class="doc-form" data-doc="${d.id}">
            <p class="sig-legal-note">La fecha y hora quedan registradas automáticamente. Este acuse queda guardado como constancia interna de que recibiste y leíste el documento — no reemplaza una firma digital certificada ante una autoridad legal.</p>
            <div class="field">
              <label>Nombre completo</label>
              <input type="text" class="ack-name" value="${state.name}">
            </div>
            <div class="field">
              <label>Número de cédula</label>
              <input type="text" class="ack-cedula" placeholder="Ej. 1017234567">
            </div>
            <div style="width:100%;margin-top:12px;">
              <label style="font-size:11.5px;font-weight:600;color:var(--primary-dark);display:block;margin-bottom:6px;">Tu firma</label>
              <div class="sig-tabs">
                <button type="button" class="sig-tab active" data-mode="draw">✍️ Dibujar con el dedo o el mouse</button>
                <button type="button" class="sig-tab" data-mode="photo">📷 Subir foto de mi firma</button>
              </div>
              <div class="sig-mode-draw">
                <div class="sig-canvas-wrap">
                  <canvas class="sig-canvas"></canvas>
                  <span class="sig-hint">Firma aquí</span>
                </div>
                <button type="button" class="sig-clear-btn">Borrar y firmar de nuevo</button>
              </div>
              <div class="sig-mode-photo" style="display:none;">
                <input type="file" accept="image/*" class="sig-photo-input">
                <div class="sig-photo-preview-wrap"></div>
              </div>
            </div>
            <div style="width:100%;">
              <label class="doc-check"><input type="checkbox" class="ack-check"> Confirmo que leí y acepto este documento</label>
            </div>
            <button class="btn btn-primary ack-submit" style="width:auto;margin-top:0;padding:10px 18px;">Firmar acuse de recibo</button>
          </div>
        `}
      </div>
    `;
  }).join('');

  list.querySelectorAll('.doc-form').forEach(form=>{
    const docId = form.dataset.doc;

    /* ---- Firma a mano (canvas) ---- */
    const canvas = form.querySelector('.sig-canvas');
    const hint = form.querySelector('.sig-hint');
    const ctx = canvas.getContext('2d');
    let drawing = false, hasDrawn = false;
    function resizeCanvas(){
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2,2);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#191A46';
    }
    resizeCanvas();
    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }
    function start(e){ drawing = true; hasDrawn = true; hint.style.display='none'; const p = posFromEvent(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; const p = posFromEvent(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function end(){ drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);

    form.querySelector('.sig-clear-btn').addEventListener('click', ()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      hasDrawn = false;
      hint.style.display = 'flex';
    });

    /* ---- Foto de la firma ---- */
    let photoDataUrl = null;
    const photoInput = form.querySelector('.sig-photo-input');
    const photoPreviewWrap = form.querySelector('.sig-photo-preview-wrap');
    photoInput.addEventListener('change', ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 400;
          const scale = Math.min(1, maxW/img.width);
          const c = document.createElement('canvas');
          c.width = img.width*scale; c.height = img.height*scale;
          const cctx = c.getContext('2d');
          cctx.fillStyle = '#fff'; cctx.fillRect(0,0,c.width,c.height);
          cctx.drawImage(img, 0, 0, c.width, c.height);
          photoDataUrl = c.toDataURL('image/jpeg', 0.75);
          photoPreviewWrap.innerHTML = `<img src="${photoDataUrl}" class="sig-photo-preview">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    /* ---- Alternar entre dibujar y subir foto ---- */
    const tabs = form.querySelectorAll('.sig-tab');
    const drawMode = form.querySelector('.sig-mode-draw');
    const photoMode = form.querySelector('.sig-mode-photo');
    tabs.forEach(tab=>{
      tab.addEventListener('click', ()=>{
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const mode = tab.dataset.mode;
        drawMode.style.display = mode==='draw' ? 'block' : 'none';
        photoMode.style.display = mode==='photo' ? 'block' : 'none';
      });
    });

    const submitBtn = form.querySelector('.ack-submit');
    submitBtn.addEventListener('click', async ()=>{
      const name = form.querySelector('.ack-name').value.trim();
      const cedula = form.querySelector('.ack-cedula').value.trim();
      const checked = form.querySelector('.ack-check').checked;
      const activeMode = form.querySelector('.sig-tab.active').dataset.mode;
      const signatureDataUrl = activeMode === 'draw'
        ? (hasDrawn ? canvas.toDataURL('image/png') : null)
        : photoDataUrl;

      if(!name || !cedula){ showInlineAlert(form, 'Escribe tu nombre completo y tu número de cédula.'); return; }
      if(!checked){ showInlineAlert(form, 'Debes marcar la casilla de confirmación.'); return; }
      if(!signatureDataUrl){ showInlineAlert(form, activeMode==='draw' ? 'Dibuja tu firma antes de continuar.' : 'Sube una foto de tu firma antes de continuar.'); return; }

      const acks = state.progress['_acuses'] || {};
      acks[docId] = { name, cedula, signedAt: new Date().toISOString(), signatureDataUrl, pendingSync:true };
      state.progress['_acuses'] = acks;
      await saveProgress();
      const relevant = DOCUMENTS.filter(d => d.roles.includes(state.rol));
      const others = DOCUMENTS.filter(d => !d.roles.includes(state.rol));
      renderDocsList([...relevant, ...others], acks);
    });
  });
}

function overallStats(){
  const total = MODULES.length;
  let completed = 0, sumScore = 0, scored = 0;
  MODULES.forEach(m=>{
    const p = state.progress[m.id];
    if(p && p.status==='completed'){ scored++; sumScore += p.score; if(p.score >= PASS_SCORE) completed++; }
  });
  const pct = Math.round((completed/total)*100);
  return {total, completed, pct};
}

function renderSidebarList(){
  const list = document.getElementById('modlist');
  list.innerHTML = MODULES.map((m,i)=>{
    const p = state.progress[m.id];
    const done = p && p.status==='completed' && p.score >= PASS_SCORE;
    const active = m.id === state.currentModuleId;
    let statusLine = '';
    if(p && p.status==='completed'){
      statusLine = `<div class="mod-score">${p.score}% · ${p.score>=PASS_SCORE?'Aprobado':'Reintentar'}</div>`;
    } else if(p && p.status==='partial'){

    return `
      <li>
        <button class="${active?'active':''} ${done?'done':''}" data-id="${m.id}">

/* ============ RENDER: QUIZ ============ */
function renderQuiz(m){
  const main = document.getElementById('main');
  const total = m.questions.length;
  const idx = state.quizIndex;
  const q = m.questions[idx];
  const pctTrack = Math.round((idx/total)*100);

  main.innerHTML = `
    <div class="topline">
      <div>
        <span class="level-tag level-${m.level}">${m.level}</span>
        <h2 style="margin:0;font-size:24px;color:var(--primary-dark);">${m.icon} ${m.title}</h2>
      </div>
    </div>
    <div class="card">
      <div class="quiz-meta">
        <span class="qcount">Pregunta ${idx+1} de ${total}</span>
        <div class="qtrack"><i style="width:${pctTrack}%"></i></div>
      </div>
      <p class="question">${q.q}</p>
      <div class="options" id="optsWrap">
        ${q.opts.map((opt,i)=>`
          <button class="opt" data-i="${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="quiz-actions">
        <button class="btn btn-next" id="nextBtn">${idx===total-1?'Ver resultado':'Siguiente pregunta'} →</button>
      </div>
    </div>
  `;

  const optsWrap = document.getElementById('optsWrap');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  optsWrap.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.answered = true;
      const chosen = parseInt(btn.dataset.i);
      const isCorrect = chosen === q.correct;
      if(isCorrect) state.correctCount = (state.correctCount||0) + 1;

      optsWrap.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        const i = parseInt(o.dataset.i);
        if(i === q.correct) o.classList.add('correct');
        else if(i === chosen) o.classList.add('incorrect');
      });

      feedback.classList.add('show', isCorrect?'ok':'bad');
      feedback.innerHTML = `<b>${isCorrect?'¡Correcto!':'No exactamente'}</b>${q.explain}`;

      nextBtn.classList.add('show');

      // Guarda el avance parcial de inmediato (no solo al terminar el módulo),
      // así el panel de administrador refleja intentos incompletos.
      const answeredSoFar = idx + 1;
      const correctSoFar = state.correctCount || 0;
      const alreadyCompleted = state.progress[m.id] && state.progress[m.id].status === 'completed';
      if(!alreadyCompleted){
        state.progress[m.id] = {
          status:'partial',
          answered: answeredSoFar,
          total: total,
          correct: correctSoFar,
          score: Math.round((correctSoFar/answeredSoFar)*100)
        };
        saveProgress();
        renderSidebarList();
      }
    });
  });

  nextBtn.addEventListener('click', ()=>{
    state.answered = false;
    if(idx < total-1){
      state.quizIndex++;
      renderQuiz(m);
    } else {
      finishQuiz(m);
    }
  });
}

async function finishQuiz(m){
  const total = m.questions.length;
  const correct = state.correctCount || 0;
  const score = Math.round((correct/total)*100);
  const prev = state.progress[m.id];
  const prevAttempts = (prev && prev.attempts) || 0;
  const attempts = prevAttempts + 1;
  const bestScore = prev && typeof prev.bestScore === 'number' ? Math.max(prev.bestScore, score) : score;
  const firstTryPassed = prev && typeof prev.firstTryPassed === 'boolean' ? prev.firstTryPassed : (attempts===1 && score>=PASS_SCORE);
  const pointsBefore = computePoints(state.progress);
  state.progress[m.id] = {status:'completed', score, bestScore, correct, total, answered: total, attempts, firstTryPassed};
  const pointsAfter = computePoints(state.progress);
  await saveProgress();
  renderSidebarList();
  refreshAppHeader();
  renderResult(m, score, correct, total, pointsAfter - pointsBefore, pointsAfter);
}

function refreshAppHeader(){
  const {pct} = overallStats();
  const pctEl = document.getElementById('overallPctApp');
  const barEl = document.getElementById('overallBarApp');
  const ptsEl = document.getElementById('pointsTextApp');
  const badgesEl = document.getElementById('badgesRowApp');
  if(pctEl) pctEl.textContent = `${pct}%`;
  if(barEl) barEl.style.width = `${pct}%`;
  if(ptsEl) ptsEl.textContent = `🏆 ${computePoints(state.progress)} puntos`;
  if(badgesEl){
    const badges = computeBadges(state.progress);
    badgesEl.innerHTML = badges.length ? `<div class="badges-row">${badges.map(b=>`<span title="${b.label}">${b.icon}</span>`).join('')}</div>` : '';
  }
}

function renderResult(m, score, correct, total, pointsEarned, pointsTotal){
  const main = document.getElementById('main');
  const passed = score >= PASS_SCORE;
  const circumference = 2*Math.PI*52;
  const dash = circumference * (score/100);
  main.innerHTML = `
    <div class="card result">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="${passed?'#E3F5F3':'#FCE9E7'}" stroke-width="12"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="${passed?'#1AA79E':'#E1574C'}" stroke-width="12"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference-dash}" stroke-linecap="round"/>
        </svg>
        <div class="pct">${score}%</div>
      </div>
      <h3>${passed ? '¡Módulo aprobado! 🎉' : 'Casi lo logras'}</h3>
      <p>Respondiste correctamente ${correct} de ${total} preguntas. ${passed ? 'Puedes continuar con el siguiente módulo.' : 'Necesitas 80% o más para aprobar este módulo. Revisa el resumen y vuelve a intentarlo.'}</p>
      ${pointsEarned > 0 ? `<div class="points-earned">🏆 +${pointsEarned} puntos · llevas ${pointsTotal} en total</div>` : ''}
      <div class="result-actions">
        <button class="btn btn-secondary" id="retryBtn">Repetir cuestionario</button>
        <button class="btn btn-primary" id="nextModBtn" style="width:auto;margin-top:0;">${nextModuleLabel(m)}</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    state.quizIndex = 0; state.correctCount = 0; state.answered = false;
    renderQuiz(m);
  });
  document.getElementById('nextModBtn').addEventListener('click', ()=>{
    const {completed, total:t} = overallStats();
    const idx = MODULES.findIndex(x=>x.id===m.id);
    if(completed === t){
      renderCertificate();
    } else if(idx < MODULES.length-1){
      state.currentModuleId = MODULES[idx+1].id;
      renderSidebarList();
      renderModuleHome(state.currentModuleId);
    } else {
      // last module but not all passed yet — go to first unpassed
      const firstUnpassed = MODULES.find(x=> !(state.progress[x.id] && state.progress[x.id].score >= PASS_SCORE));
      state.currentModuleId = firstUnpassed ? firstUnpassed.id : MODULES[0].id;
      renderSidebarList();
      renderModuleHome(state.currentModuleId);
    }
  });
}

function nextModuleLabel(m){
  const idx = MODULES.findIndex(x=>x.id===m.id);
  const {completed, total} = overallStats();
  if(completed === total) return 'Ver certificado 🎓';
  if(idx < MODULES.length-1) return 'Siguiente módulo →';
  return 'Ir a módulos pendientes';
}

/* ============ MOTOR GENÉRICO DE TRACKS (Manual de Funciones, Protocolos, etc.) ============
   Reutiliza la misma experiencia de Políticas (sidebar, quiz, resultados) para
   cualquier track nuevo, usando progKey(prefix, moduleId) para no chocar con
   otras claves en state.progress. */
function genericOverallStats(trackDef){
  const total = trackDef.modules.length;
  let completed = 0;
  trackDef.modules.forEach(m=>{
    const p = state.progress[progKey(trackDef.prefix, m.id)];
    if(p && p.status==='completed' && p.score >= PASS_SCORE) completed++;
  });
  const pct = total ? Math.round((completed/total)*100) : 0;
  return {total, completed, pct};
}

}

function renderGenericSidebarList(trackDef){
  const list = document.getElementById('modlistG');
  list.innerHTML = trackDef.modules.map((m,i)=>{
    const p = state.progress[progKey(trackDef.prefix, m.id)];
    const done = p && p.status==='completed' && p.score >= PASS_SCORE;
    const active = m.id === state.currentModuleId;
    let statusLine = '';
    if(p && p.status==='completed'){
      statusLine = `<div class="mod-score">${p.score}% · ${p.score>=PASS_SCORE?'Aprobado':'Reintentar'}</div>`;
    } else if(p && p.status==='partial'){
      statusLine = `<div class="mod-score">En curso · ${p.answered}/${p.total}</div>`;
    }
    return `
      <li>
        <button class="${active?'active':''} ${done?'done':''}" data-id="${m.id}">
          <span class="mod-num">${done?'✓':(i+1)}</span>
          <span class="mod-title">${m.title}${statusLine}</span>
        </button>
      </li>
    `;
  }).join('');
  list.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.currentModuleId = btn.dataset.id;
      renderGenericModuleHome(trackDef, state.currentModuleId);
      list.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const mainEl = document.getElementById('main');
      if(mainEl) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

      ${p && p.status==='partial' ? `<p style="margin:14px 0 0;font-size:13px;color:var(--ink-soft);">Ibas en la pregunta <b style="color:var(--primary-dark)">${p.answered} de ${p.total}</b>. Al continuar, empiezas de nuevo desde la primera pregunta.</p>` : ''}

  `;

}

function renderGenericQuiz(trackDef, m){
  const main = document.getElementById('main');
  const total = m.questions.length;
  const idx = state.quizIndex;
  const q = m.questions[idx];
  const pctTrack = Math.round((idx/total)*100);

  main.innerHTML = `
    <div class="topline">
      <div>
        <span class="level-tag level-${m.level}">${m.level}</span>
        <h2 style="margin:0;font-size:24px;color:var(--primary-dark);">${m.icon} ${m.title}</h2>
      </div>
    </div>
    <div class="card">
      <div class="quiz-meta">
        <span class="qcount">Pregunta ${idx+1} de ${total}</span>
        <div class="qtrack"><i style="width:${pctTrack}%"></i></div>
      </div>
      <p class="question">${q.q}</p>
      <div class="options" id="optsWrapG">
        ${q.opts.map((opt,i)=>`
          <button class="opt" data-i="${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedbackG"></div>
      <div class="quiz-actions">
        <button class="btn btn-next" id="nextBtnG">${idx===total-1?'Ver resultado':'Siguiente pregunta'} →</button>
      </div>
    </div>
  `;

  const optsWrap = document.getElementById('optsWrapG');
  const feedback = document.getElementById('feedbackG');
  const nextBtn = document.getElementById('nextBtnG');

  optsWrap.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.answered = true;
      const chosen = parseInt(btn.dataset.i);
      const isCorrect = chosen === q.correct;
      if(isCorrect) state.correctCount = (state.correctCount||0) + 1;

      optsWrap.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        const i = parseInt(o.dataset.i);
        if(i === q.correct) o.classList.add('correct');
        else if(i === chosen) o.classList.add('incorrect');
      });

      feedback.classList.add('show', isCorrect?'ok':'bad');
      feedback.innerHTML = `<b>${isCorrect?'¡Correcto!':'No exactamente'}</b>${q.explain}`;

      nextBtn.classList.add('show');

      const answeredSoFar = idx + 1;
      const correctSoFar = state.correctCount || 0;
      const key = progKey(trackDef.prefix, m.id);
      const alreadyCompleted = state.progress[key] && state.progress[key].status === 'completed';
      if(!alreadyCompleted){
        state.progress[key] = {
          status:'partial',
          answered: answeredSoFar,
          total: total,
          correct: correctSoFar,
          score: Math.round((correctSoFar/answeredSoFar)*100)
        };
        saveProgress();
        renderGenericSidebarList(trackDef);
      }
    });
  });

  nextBtn.addEventListener('click', ()=>{
    state.answered = false;
    if(idx < total-1){
      state.quizIndex++;
      renderGenericQuiz(trackDef, m);
    } else {
      finishGenericQuiz(trackDef, m);
    }
  });
}

async function finishGenericQuiz(trackDef, m){
  const total = m.questions.length;
  const correct = state.correctCount || 0;
  const score = Math.round((correct/total)*100);
  const key = progKey(trackDef.prefix, m.id);
  const prev = state.progress[key];
  const prevAttempts = (prev && prev.attempts) || 0;
  const attempts = prevAttempts + 1;
  const bestScore = prev && typeof prev.bestScore === 'number' ? Math.max(prev.bestScore, score) : score;
  const firstTryPassed = prev && typeof prev.firstTryPassed === 'boolean' ? prev.firstTryPassed : (attempts===1 && score>=PASS_SCORE);
  const pointsBefore = computePoints(state.progress);
  state.progress[key] = {status:'completed', score, bestScore, correct, total, answered: total, attempts, firstTryPassed};
  const pointsAfter = computePoints(state.progress);
  await saveProgress();
  renderGenericSidebarList(trackDef);
  refreshGenericHeader(trackDef);
  renderGenericResult(trackDef, m, score, correct, total, pointsAfter - pointsBefore, pointsAfter);
}

function refreshGenericHeader(trackDef){
  const {pct} = genericOverallStats(trackDef);
  const pctEl = document.getElementById('overallPctG');
  const barEl = document.getElementById('overallBarG');
  const ptsEl = document.getElementById('pointsTextG');
  if(pctEl) pctEl.textContent = `${pct}%`;
  if(barEl) barEl.style.width = `${pct}%`;
  if(ptsEl) ptsEl.textContent = `🏆 ${computePoints(state.progress)} puntos`;
}

function renderGenericResult(trackDef, m, score, correct, total, pointsEarned, pointsTotal){
  const main = document.getElementById('main');
  const passed = score >= PASS_SCORE;
  const circumference = 2*Math.PI*52;
  const dash = circumference * (score/100);
  main.innerHTML = `
    <div class="card result">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="${passed?'#E3F5F3':'#FCE9E7'}" stroke-width="12"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="${passed?'#1AA79E':'#E1574C'}" stroke-width="12"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference-dash}" stroke-linecap="round"/>
        </svg>
        <div class="pct">${score}%</div>
      </div>
      <h3>${passed ? '¡Módulo aprobado! 🎉' : 'Casi lo logras'}</h3>
      <p>Respondiste correctamente ${correct} de ${total} preguntas. ${passed ? 'Puedes continuar con el siguiente módulo.' : 'Necesitas 80% o más para aprobar este módulo. Revisa el resumen y vuelve a intentarlo.'}</p>
      ${pointsEarned > 0 ? `<div class="points-earned">🏆 +${pointsEarned} puntos · llevas ${pointsTotal} en total</div>` : ''}
      <div class="result-actions">
        <button class="btn btn-secondary" id="retryBtnG">Repetir cuestionario</button>
        <button class="btn btn-primary" id="nextModBtnG" style="width:auto;margin-top:0;">${nextGenericModuleLabel(trackDef, m)}</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtnG').addEventListener('click', ()=>{
    state.quizIndex = 0; state.correctCount = 0; state.answered = false;
    renderGenericQuiz(trackDef, m);
  });
  document.getElementById('nextModBtnG').addEventListener('click', ()=>{
    const {completed, total:t} = genericOverallStats(trackDef);
    const idx = trackDef.modules.findIndex(x=>x.id===m.id);
    if(completed === t){
      renderGenericTrackComplete(trackDef);
    } else if(idx < trackDef.modules.length-1){
      state.currentModuleId = trackDef.modules[idx+1].id;
      renderGenericSidebarList(trackDef);
      renderGenericModuleHome(trackDef, state.currentModuleId);
    } else {
      const firstUnpassed = trackDef.modules.find(x=> {
        const px = state.progress[progKey(trackDef.prefix, x.id)];
        return !(px && px.score >= PASS_SCORE);
      });
      state.currentModuleId = firstUnpassed ? firstUnpassed.id : trackDef.modules[0].id;
      renderGenericSidebarList(trackDef);
      renderGenericModuleHome(trackDef, state.currentModuleId);
    }
  });
}

function nextGenericModuleLabel(trackDef, m){
  const idx = trackDef.modules.findIndex(x=>x.id===m.id);
  const {completed, total} = genericOverallStats(trackDef);
  if(completed === total) return 'Ver resumen del track 🎉';
  if(idx < trackDef.modules.length-1) return 'Siguiente módulo →';
  return 'Ir a módulos pendientes';
}
