                <td style="padding:10px 8px;font-weight:600;color:var(--ink);">${s.empleado}</td>
                <td style="padding:10px 8px;color:var(--ink-soft);">${s.rol}</td>
                <td style="padding:10px 8px;color:var(--ink);">${s.doc}</td>
                <td style="padding:10px 8px;color:var(--ink);">${s.nombreFirma}</td>
                <td style="padding:10px 8px;color:var(--ink-soft);">${s.cedula}</td>
                <td style="padding:10px 8px;color:var(--ink-soft);font-size:12px;">${new Date(s.signedAt).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}</td>
                <td style="padding:10px 8px;">${s.signatureDataUrl ? `<img src="${s.signatureDataUrl}" alt="Firma" style="max-width:90px;max-height:40px;border:1px solid var(--line);border-radius:4px;background:#fff;">` : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>

    <h2 style="margin:0 0 14px;font-size:19px;color:var(--primary-dark);">📚 Inventario de contenido</h2>
    <div class="card" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:700px;">
        <thead>
          <tr style="text-align:left;border-bottom:2px solid var(--line);">
            <th style="padding:10px 8px;">Pilar / Track</th>
            <th style="padding:10px 8px;">Módulo</th>
            <th style="padding:10px 8px;text-align:center;">Preguntas</th>
            <th style="padding:10px 8px;text-align:center;">Estado</th>
          </tr>
        </thead>
        <tbody>
          ${[
            {track:'Políticas de Operación', mods:MODULES},
            {track:'Manual de Funciones — Recepción', mods:MF_RECEPCION},
            {track:'Manual de Funciones — Servicio al Cliente', mods:MF_SERVICIO},
            {track:'Manual de Funciones — Auxiliar de Odontología', mods:MF_AUXILIAR},
            {track:'Seguridad y Salud en el Trabajo', mods:SST_MODULES},
          ].flatMap(t => t.mods.map(m => `
            <tr style="border-bottom:1px solid var(--line);">
              <td style="padding:9px 8px;color:var(--ink-soft);">${t.track}</td>
              <td style="padding:9px 8px;color:var(--ink);font-weight:600;">${m.title}</td>
              <td style="padding:9px 8px;text-align:center;">${m.questions.length}</td>
              <td style="padding:9px 8px;text-align:center;"><span style="background:#E3F5F3;color:#0F6E77;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">✅ Activo</span></td>
            </tr>
          `)).join('')}
          <tr style="border-bottom:1px solid var(--line);">
            <td style="padding:9px 8px;color:var(--ink-soft);">Así actuamos en Dentilandia</td>
            <td style="padding:9px 8px;color:var(--ink);font-weight:600;">8 principios de actitud</td>
            <td style="padding:9px 8px;text-align:center;">—</td>
            <td style="padding:9px 8px;text-align:center;"><span style="background:#E3F5F3;color:#0F6E77;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">✅ Activo</span></td>
          </tr>
          ${VIDEO_CATEGORIES.map(cat=>{
            const vids = VIDEOTECA.filter(v=>v.categoria===cat.id);
            const loaded = vids.filter(v=>v.videoUrl).length;
            return `
              <tr style="border-bottom:1px solid var(--line);">
                <td style="padding:9px 8px;color:var(--ink-soft);">Videoteca</td>
                <td style="padding:9px 8px;color:var(--ink);font-weight:600;">${cat.label}</td>
                <td style="padding:9px 8px;text-align:center;">${loaded}/${vids.length} videos</td>
                <td style="padding:9px 8px;text-align:center;">${loaded>0 ? `<span style="background:#E3F5F3;color:#0F6E77;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">✅ Activo</span>` : `<span style="background:#EDEEF0;color:#6B6C78;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">Próximamente</span>`}</td>
              </tr>
            `;
          }).join('')}
          <tr>
            <td style="padding:9px 8px;color:var(--ink-soft);">Documentos y acuse de recibo</td>
            <td style="padding:9px 8px;color:var(--ink);font-weight:600;">${DOCUMENTS.map(d=>d.title).join(', ')}</td>
            <td style="padding:9px 8px;text-align:center;">${DOCUMENTS.length} docs</td>
            <td style="padding:9px 8px;text-align:center;"><span style="background:#FDF0D8;color:#8A5A00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">Ejemplo — falta PDF real</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{
    renderHome();
  });
  const resetAllBtn = document.getElementById('resetAllBtn');
  if(resetAllBtn){
    resetAllBtn.addEventListener('click', ()=>{
      showConfirmModal({
        title: '🧹 Reiniciar toda la puntuación',
        message: `Esto va a borrar el progreso, los puntos, las insignias y los documentos firmados de <b>las ${employees.length} personas</b> que aparecen ahora mismo en esta tabla. Es ideal para dejar todo limpio antes de desplegar con el equipo real — pero <b>no se puede deshacer</b>. ¿Continuar?`,
        confirmLabel: 'Sí, borrar todo',
        onConfirm: async ()=>{
          resetAllBtn.textContent = 'Borrando…';
          const failed = [];
          for(const emp of employees){
            const ok = await deleteEmployeeData(emp.id);
            if(!ok) failed.push(emp.name);
          }
          await renderAdminPanel();
          if(failed.length){
            showConfirmModal({
              title: '⚠️ Algunos no se pudieron borrar',
              message: `No se pudo borrar a: <b>${failed.join(', ')}</b>. Parece una falla temporal del servidor — espera un momento y vuelve a intentar el botón de reiniciar, o bórralos uno por uno con 🗑️ Eliminar.`,
              confirmLabel: 'Entendido',
              onConfirm: ()=>{}
            });
          }
        }
      });
    });
  }
  document.querySelectorAll('.delete-emp-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const name = btn.dataset.name;
      showConfirmModal({
        title: '🗑️ Eliminar datos',
        message: `¿Seguro que quieres borrar todo el progreso, puntos e insignias de <b>${name}</b>? Esto no se puede deshacer.`,
        confirmLabel: 'Sí, eliminar',
        onConfirm: async ()=>{
          const ok = await deleteEmployeeData(id);
          await renderAdminPanel();
          if(!ok){
            showConfirmModal({
              title: '⚠️ No se pudo borrar',
              message: `No se pudo borrar a <b>${name}</b> — parece una falla temporal del servidor. Espera un momento e inténtalo de nuevo.`,
              confirmLabel: 'Entendido',
              onConfirm: ()=>{}
            });
          }
        }
      });
    });
  });
}

async function deleteEmployeeData(perfilId){
  // Borra solo el progreso de Capacitación de esa persona — NO su cuenta ni su
  // perfil del ERP, que sigue existiendo para que pueda volver a entrar.
  const delays = [500, 1200, 2500];
  for(let attempt=0; attempt<=delays.length; attempt++){
    try{
      await Promise.all([
        sb.from('capacitacion_progreso').delete().eq('perfil_id', perfilId),
        sb.from('capacitacion_asi_actuamos').delete().eq('perfil_id', perfilId),
        sb.from('capacitacion_video_visto').delete().eq('perfil_id', perfilId),
        sb.from('capacitacion_documentos_firmados').delete().eq('perfil_id', perfilId),
      ]);
      return true;
    }catch(e){
      if(attempt < delays.length){
        console.error(`No se pudo eliminar los datos (intento ${attempt+1}), reintentando…`, e);
        await new Promise(r => setTimeout(r, delays[attempt]));
      } else {
        console.error('No se pudo eliminar los datos después de varios intentos', e);
        return false;
      }
    }
  }
}

function showConfirmModal({title, message, confirmLabel, onConfirm}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${title}</h3>
      <p>${message}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmCancelBtn" style="width:auto;padding:9px 16px;margin-top:0;">Cancelar</button>
        <button class="btn btn-primary" id="confirmOkBtn" style="width:auto;padding:9px 16px;margin-top:0;background:#E1574C;">${confirmLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#confirmCancelBtn').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  overlay.querySelector('#confirmOkBtn').addEventListener('click', ()=>{ close(); onConfirm(); });
}

renderGate();
</script>
